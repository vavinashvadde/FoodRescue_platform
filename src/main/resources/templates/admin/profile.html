<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile | Food Rescue</title>

<link rel="stylesheet" href="/css/admin/profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="dashboard-container">



<!-- SIDEBAR -->

<aside class="sidebar">


<div class="logo">

<i class="fa-solid fa-shield-heart"></i>

<h2>Admin Panel</h2>

</div>



<ul>


<li>

<a href="/admin-dashboard">

<i class="fa-solid fa-chart-line"></i>

Dashboard

</a>

</li>



<li>

<a href="/admin-restaurants">

<i class="fa-solid fa-utensils"></i>

Restaurants

</a>

</li>




<li>

<a href="/admin-ngos">

<i class="fa-solid fa-hand-holding-heart"></i>

NGOs

</a>

</li>




<li>

<a href="/admin-volunteers">

<i class="fa-solid fa-person-circle-check"></i>

Volunteers

</a>

</li>




<li>

<a href="/admin-donations">

<i class="fa-solid fa-box-open"></i>

Donations

</a>

</li>




<li>

<a href="/admin-reports">

<i class="fa-solid fa-chart-pie"></i>

Reports

</a>

</li>




<li class="active">

<a href="/admin-profile">

<i class="fa-solid fa-user-shield"></i>

Profile

</a>

</li>




<li>

<a href="#" onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>



</ul>


</aside>







<!-- MAIN -->


<main class="main-content">



<div class="topbar">


<div>

<h1>

<i class="fa-solid fa-user-shield"></i>

Admin Profile

</h1>


<p>

Manage your administrator account details.

</p>


</div>




<div class="profile-icon">

<i class="fa-solid fa-user-shield"></i>

</div>



</div>







<div class="profile-card">



<div class="profile-header">


<div class="avatar">

<i class="fa-solid fa-user-shield"></i>

</div>


<h2 id="adminName">

Loading...

</h2>


<p id="adminRole">

ADMIN

</p>


</div>







<div class="profile-details">



<div class="input-group">

<label>
Admin Name
</label>

<input type="text" id="name">

</div>





<div class="input-group">

<label>
Email
</label>

<input type="email" id="email">

</div>





<div class="input-group">

<label>
Role
</label>

<input type="text" id="role" readonly>

</div>





<div class="input-group">

<label>
Status
</label>

<input type="text" id="status" readonly>

</div>




</div>





<!--button onclick="updateProfile()">

<i class="fa-solid fa-pen"></i>

Update Profile

</button-->



</div>







</main>



</div>





<script src="/js/common/toast.js"></script>

<script src="/js/admin/profile.js"></script>


</body>

</html>

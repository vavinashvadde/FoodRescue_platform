<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restaurant Profile | Food Rescue Platform</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Toast CSS -->

    <link rel="stylesheet"
          href="/css/common/toast.css">

    <!-- Profile CSS -->

    <link rel="stylesheet"
          href="/css/restaurant/profile.css">

</head>

<body>

<div class="dashboard">

    <!-- =========================
            SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-utensils"></i>

            <h2>Food Rescue</h2>

        </div>

        <ul class="menu">

            <li>

                <a href="/restaurant-dashboard">

                    <i class="fa-solid fa-house"></i>

                    <span>Dashboard</span>

                </a>

            </li>

            <li>

                <a href="/donate-food">

                    <i class="fa-solid fa-bowl-food"></i>

                    <span>Donate Food</span>

                </a>

            </li>

            <li>

                <a href="/requests">

                    <i class="fa-solid fa-list-check"></i>

                    <span>Manage Donations</span>

                </a>

            </li>

            <li>

                <a href="/donation-history">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span>Donation History</span>

                </a>

            </li>

            <li class="active">

                <a href="/profile">

                    <i class="fa-solid fa-user"></i>

                    <span>Profile</span>

                </a>

            </li>

            

            <li>

                <a href="#"
                   id="logoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span>Logout</span>

                </a>

            </li>

        </ul>

    </aside>

    <!-- =========================
            CONTENT
    ========================== -->

    <main class="content">

        <header class="page-header">

            <h1>

                Restaurant Profile

            </h1>

            <p>

                View and update your restaurant information.

            </p>

        </header>

        <div class="profile-card">

            <div class="profile-icon">

                <i class="fa-solid fa-store"></i>

            </div>

            <form id="profileForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>

                            Restaurant Name

                        </label>

                        <input

                                type="text"

                                id="restaurantName"

                                readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            Owner Name

                        </label>

                        <input

                                type="text"

                                id="ownerName"

                                readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            Email

                        </label>

                        <input

                                type="email"

                                id="email"

                                readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            Phone

                        </label>

                        <input

                                type="text"

                                id="phone"

                                required>

                    </div>

                    <div class="form-group">

                        <label>

                            License Number

                        </label>

                        <input

                                type="text"

                                id="licenseNumber"

                                readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            City

                        </label>

                        <input

                                type="text"

                                id="city"

                                required>

                    </div>

                    <div class="form-group full-width">

                        <label>

                            Address

                        </label>

                        <textarea

                                  id="address"

                                  rows="4"

                                  required>

                        </textarea>

                    </div>

                    <div class="form-group">

                        <label>

                            Status

                        </label>

                        <input

                                type="text"

                                id="status"

                                readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            Joined On

                        </label>

                        <input

                                type="text"

                                id="createdAt"

                                readonly>

                    </div>

                </div>

                <button

                        type="submit"

                        class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

            </form>

        </div>

    </main>

</div>

<!-- Toast -->

<script src="/js/common/toast.js"></script>

<!-- Profile JS -->

<script src="/js/restaurant/profile.js"></script>

</body>

</html>
